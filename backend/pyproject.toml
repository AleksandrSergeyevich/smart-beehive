[tool.poetry]
name = "smart-beehive-backend"
version = "0.2.0"
description = "Smart Beehive IoT monitoring system backend"
authors = ["Shavrov A.S. <shavrov@spbstu.ru>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
pydantic = "^2.6.0"
influxdb-client = "^1.41.0"
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
black = "^24.3.0"
pylint = "^3.1.0"
mypy = "^1.9.0"
locust = "^2.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
