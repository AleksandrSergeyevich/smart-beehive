name: CI Pipeline

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - develop
  pull_request:
    branches:
      - develop

jobs:
  # ─── Backend: lint + test ───────────────────────────────────────────
  backend-ci:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: beehive_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==1.7.1

      - name: Install backend dependencies
        working-directory: ./backend
        run: poetry install

      - name: Check formatting (Black)
        working-directory: ./backend
        run: poetry run black --check src/ tests/

      - name: Static analysis (Pylint)
        working-directory: ./backend
        run: poetry run pylint src/ --fail-under=7.5

      - name: Type check (Mypy)
        working-directory: ./backend
        run: poetry run mypy src/

      - name: Run unit tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/beehive_test
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: test-token
          INFLUX_ORG: beehive
          INFLUX_BUCKET: sensors
        run: |
          poetry run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend

  # ─── Frontend: lint + test ──────────────────────────────────────────
  frontend-ci:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: TypeScript type check
        working-directory: ./frontend
        run: echo "TypeScript check skipped — no source files yet"

      - name: ESLint
        working-directory: ./frontend
        run: echo "ESLint check skipped — no source files yet"

      - name: Run tests
        working-directory: ./frontend
        run: echo "Frontend tests skipped — no source files yet"

  # ─── Docker build check ─────────────────────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: false
          tags: smart-beehive/backend:test

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: false
          tags: smart-beehive/frontend:test

  # ─── Deploy to DEV (on merge to develop) ───────────────────────────
  deploy-dev:
    name: Deploy — Dev Environment
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/smart-beehive
            git pull origin develop
            docker compose pull
            docker compose up -d --build
            docker compose ps

  # ─── Deploy to PROD (on release tag) ───────────────────────────────
  deploy-prod:
    name: Deploy — Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/beehive-backend:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/beehive-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/beehive-frontend:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/beehive-frontend:latest

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/smart-beehive
            docker compose pull
            docker compose up -d
            docker compose ps
